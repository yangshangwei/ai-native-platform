<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AI Native Platform · Delivery Workbench</title>
    <!-- Design System - Sub2API Style -->
    <link rel="stylesheet" href="/design-tokens.css" />
    <link rel="stylesheet" href="/components.css" />
    <link rel="stylesheet" href="/utilities.css" />
    <style>
      :root {
        --bg: #f8fafc;
        --surface: #ffffff;
        --surface-2: #eef4ff;
        --line: #dbe3ef;
        --line-strong: #c4d0e1;
        --text: #1e293b;
        --muted: #64748b;
        --faint: #94a3b8;
        --primary: #2563eb;
        --primary-2: #60a5fa;
        --orange: #f97316;
        --good: #15803d;
        --good-bg: #dcfce7;
        --bad: #b91c1c;
        --bad-bg: #fee2e2;
        --warn: #a16207;
        --warn-bg: #fef3c7;
        --info: #1d4ed8;
        --info-bg: #dbeafe;
        --shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
        --radius: 18px;
      }

      * { box-sizing: border-box; }
      html { color-scheme: light; }
      body {
        margin: 0;
        min-width: 360px;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.55 "Fira Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      button, input, select, textarea { font: inherit; }
      button { cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: .55; }
      button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
        outline: 3px solid rgba(37, 99, 235, .32);
        outline-offset: 2px;
      }
      code, pre, .command-chip { font-family: "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

      .app-shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 284px minmax(0, 1fr);
      }
      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        overflow: auto;
        padding: 22px 18px;
        background: #0f172a;
        color: #e2e8f0;
        border-right: 1px solid #172554;
      }
      .brand { display: flex; gap: 12px; align-items: center; margin-bottom: 26px; }
      .brand-mark {
        width: 42px; height: 42px; border-radius: 14px;
        display: grid; place-items: center;
        background: var(--primary); color: #fff; font-weight: 800;
      }
      .brand strong { display: block; font-size: 15px; }
      .brand span { display: block; color: #93a4bd; font-size: 12px; }
      .nav-list { display: grid; gap: 8px; }
      .nav-item {
        width: 100%; min-height: 58px; border: 0; border-radius: 14px;
        background: transparent; color: #cbd5e1; padding: 10px 12px;
        display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center;
        text-align: left; transition: background .18s ease, color .18s ease;
        position: relative;
      }
      .nav-item:hover, .nav-item.active { background: rgba(96, 165, 250, .14); color: #fff; }
      .nav-item strong { display: block; font-size: 14px; }
      .nav-item small { display: block; color: #93a4bd; font-size: 11px; }
      .nav-badge {
        min-width: 20px; height: 20px; border-radius: 999px;
        background: var(--bad); color: #fff;
        display: grid; place-items: center;
        font-size: 11px; font-weight: 900;
        padding: 0 6px;
      }
      .nav-divider {
        height: 1px; margin: 4px 0;
        background: rgba(148, 163, 184, .18);
      }
      .icon { width: 20px; height: 20px; }
      .sidebar-card {
        margin-top: 22px; padding: 14px; border-radius: 16px;
        background: rgba(15, 23, 42, .78); border: 1px solid rgba(148, 163, 184, .18);
      }
      .sidebar-card h2 { color: #cbd5e1; }
      .queue-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

      .main-shell { min-width: 0; }
      .topbar {
        position: sticky; top: 0; z-index: 10;
        background: rgba(248, 250, 252, .92); backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--line);
        padding: 18px 28px;
        display: grid; grid-template-columns: minmax(220px, 1fr) auto; gap: 20px; align-items: center;
      }
      .eyebrow { color: var(--primary); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; font-size: 11px; }
      .topbar h1 { margin: 2px 0 0; font-size: clamp(22px, 2vw, 32px); line-height: 1.15; }
      .topbar-right { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
      .global-status-strip { display: flex; gap: 8px; align-items: center; }
      .global-status-badge {
        display: flex; align-items: center; gap: 6px;
        padding: 6px 12px; border-radius: 999px;
        font-size: 12px; font-weight: 700;
        border: 1px solid;
      }
      .global-status-badge.bad { background: var(--bad-bg); border-color: #fca5a5; color: var(--bad); }
      .global-status-badge.info { background: var(--info-bg); border-color: #93c5fd; color: var(--info); }
      .global-status-badge.good { background: var(--good-bg); border-color: #86efac; color: var(--good); }
      .global-status-badge.warn { background: var(--warn-bg); border-color: #fcd34d; color: var(--warn); }
      .status-badge-count {
        min-width: 20px; height: 20px; border-radius: 999px;
        display: grid; place-items: center;
        font-weight: 900; font-size: 11px;
      }
      .global-status-badge.bad .status-badge-count { background: var(--bad); color: white; }
      .global-status-badge.info .status-badge-count { background: var(--info); color: white; }
      .global-status-badge.good .status-badge-count { background: var(--good); color: white; }
      .global-status-badge.warn .status-badge-count { background: var(--warn); color: white; }
      .status-badge-label { white-space: nowrap; }
      .topbar h1 { margin: 2px 0 0; font-size: clamp(22px, 2vw, 32px); line-height: 1.15; }
      .context-strip { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; max-width: 760px; }

      /* Welcome Guide */
      .welcome-guide {
        grid-column: 1 / -1;
        background: linear-gradient(135deg, #eff6ff 0%, #f0fdf4 100%);
        border: 2px solid var(--primary-2);
      }
      .welcome-checklist { display: grid; gap: 12px; margin-top: 12px; }
      .checklist-item {
        display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: start;
        padding: 12px; border-radius: 12px; background: white;
        border: 1px solid var(--line);
      }
      .checklist-item.completed {
        background: var(--good-bg); border-color: #86efac;
      }
      .checklist-icon {
        font-size: 24px; line-height: 1;
      }
      .checklist-content { display: grid; gap: 4px; }
      .checklist-content strong { font-size: 14px; }
      .checklist-detail {
        margin: 0; color: var(--muted); font-size: 13px;
        display: flex; align-items: center; gap: 8px;
      }

      .context-item {
        min-width: 118px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 14px;
        background: var(--surface); box-shadow: var(--shadow);
      }
      .context-item span { display: block; color: var(--muted); font-size: 11px; }
      .context-item strong { display: block; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
      .good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); } .info { color: var(--info); } .muted { color: var(--muted); }

      .workbench-grid { padding: 24px 28px 36px; display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 20px; align-items: start; }
      .task-detail-grid { padding: 24px 28px 36px; display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 20px; align-items: start; }
      .workspace-main, .workspace-side, .page-stack { min-width: 0; display: grid; gap: 18px; }
      .mobile-next-action { display: none; }
      .desktop-next-action { display: block; }
      .page-grid { padding: 24px 28px 36px; display: grid; gap: 20px; }
      .page-grid.two-col { grid-template-columns: minmax(0, 1fr) minmax(320px, 440px); align-items: start; }

      .panel, .hero-card, .form-card, .empty-state {
        background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
        box-shadow: var(--shadow); padding: 18px; min-width: 0;
      }
      .hero-card { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(320px, .8fr); gap: 18px; align-items: center; }
      .hero-copy h2 { margin: 8px 0 8px; font-size: clamp(24px, 3vw, 40px); line-height: 1.1; letter-spacing: 0; }
      .hero-copy p { margin: 0; color: var(--muted); word-break: break-word; }
      .run-meta-line { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); }
      .panel-header { margin-bottom: 14px; }
      .panel-header h2 { margin: 0; font-size: 15px; letter-spacing: 0; }
      .panel-header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
      .side-panel { padding: 16px; }

      .task-hero { grid-template-columns: 1fr; align-items: start; max-width: 100%; }
      .task-hero > * { min-width: 0; }
      .task-hero .hero-copy h2 { font-size: clamp(24px, 2.4vw, 34px); overflow-wrap: anywhere; }
      .task-technical-summary { margin-top: 12px; }
      .task-technical-summary[open] { display: grid; gap: 4px; }
      .task-technical-summary summary,
      .diagnostic-shell > summary,
      .stream-log-details > summary {
        cursor: pointer; min-height: 34px; font-weight: 800;
        display: flex; align-items: center; justify-content: space-between; gap: 8px;
      }
      .diagnostic-panel { background: #fbfdff; }
      .diagnostic-shell { border-top: 0; padding-top: 0; }
      .diagnostic-shell[open] { display: grid; gap: 10px; }
      .diagnostic-metrics { margin: 10px 0; }

      .metric-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .overview-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
      .config-grid { display: grid; grid-template-columns: repeat(5, minmax(160px, 1fr)); gap: 10px; }
      .overview-card { border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: #fbfdff; min-height: 128px; min-width: 0; }
      .overview-card-head, .mini-row, .knowledge-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .mini-row { min-width: 0; max-width: 100%; overflow: hidden; border-top: 1px dashed var(--line); padding-top: 7px; font-size: 12px; }
      .mini-row span { flex: 1 1 auto; min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .mini-row .button, .mini-row code { flex: 0 0 auto; }
      .workbench-action-panel { display: grid; gap: 12px; }
      .workbench-primary-action {
        display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center;
        border: 1px solid #fed7aa; border-radius: 14px; background: #fff7ed; padding: 14px;
      }
      .workbench-primary-copy { min-width: 0; display: grid; gap: 5px; }
      .workbench-primary-copy strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .workbench-primary-copy small { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .workbench-secondary-actions { display: grid; gap: 8px; }
      .empty-action-panel { border-color: #bfdbfe; background: #eff6ff; }
      .workbench-stat-card .stack { gap: 8px; }
      .workbench-task-section { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
      .workbench-task-section:first-of-type { border-top: 0; padding-top: 0; }
      .workbench-section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .workbench-section-head h3 { margin: 0; font-size: 14px; }
      .workbench-all-tasks { margin-top: 12px; }
      .workbench-environment-panel { background: #fbfdff; }
      .workbench-environment-details summary { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .metric-card { min-width: 0; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: #fbfdff; }
      .metric-label, .metric-hint { display: block; color: var(--muted); font-size: 12px; }
      .metric-value { display: block; font-size: 22px; line-height: 1.15; margin: 3px 0; }

      .stage-board { display: grid; grid-template-columns: repeat(9, minmax(105px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 4px; }
      .stage-card { min-height: 120px; border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: grid; gap: 6px; align-content: start; background: #fbfdff; }
      .stage-card.done { border-color: #86efac; background: #f0fdf4; }
      .stage-card.active { border-color: #93c5fd; background: #eff6ff; }
      .stage-card.blocked { border-color: #fdba74; background: #fff7ed; }
      .stage-card.failed { border-color: #fecaca; background: #fef2f2; }
      .stage-index { color: var(--faint); font-weight: 800; font-size: 11px; }
      .stage-card strong { font-size: 13px; }
      .stage-card small { color: var(--muted); line-height: 1.35; }
      .stage-state { align-self: end; width: fit-content; border-radius: 999px; padding: 2px 8px; font-size: 11px; text-transform: uppercase; }
      .stage-state.done { background: var(--good-bg); color: var(--good); }
      .stage-state.active { background: var(--info-bg); color: var(--info); }
      .stage-state.blocked { background: var(--warn-bg); color: var(--warn); }
      .stage-state.failed { background: var(--bad-bg); color: var(--bad); }
      .stage-state.waiting { background: #e2e8f0; color: var(--muted); }

      .stage-panel-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
      .current-stage-panel { display: grid; gap: 12px; }
      .stage-detail-list { display: grid; gap: 10px; }
      .stage-detail { border: 1px solid var(--line); border-radius: 14px; background: #fbfdff; padding: 10px 12px; }
      .stage-detail.done { border-color: #bbf7d0; }
      .stage-detail.active { border-color: #bfdbfe; background: #eff6ff; }
      .stage-detail.blocked { border-color: #fed7aa; background: #fff7ed; }
      .stage-detail.failed { border-color: #fecaca; background: #fef2f2; }
      .stage-detail summary { cursor: pointer; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-height: 34px; }
      .doc-panel { min-height: 280px; }
      .structured-panel { display: grid; gap: 12px; }
      .structured-section { border-top: 1px solid var(--line); padding-top: 10px; }
      .structured-section h3 { margin: 0 0 8px; font-size: 13px; color: var(--text); }
      .clean-list { margin: 0; padding-left: 18px; color: var(--text); }
      .clean-list li { margin: 4px 0; }
      .ac-list, .acceptance-list { display: grid; gap: 8px; }
      .ac-card, .acceptance-card, .knowledge-card, .log-card { border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: #fbfdff; display: grid; gap: 8px; }
      .ac-card { grid-template-columns: auto 1fr; align-items: start; }
      .acceptance-card.passed { background: #f0fdf4; border-color: #86efac; }
      .acceptance-card.at_risk { background: #fff7ed; border-color: #fdba74; }
      .acceptance-card.missing { background: #fef2f2; border-color: #fecaca; }
      .coverage-table { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
      .coverage-row { display: grid; grid-template-columns: 1fr 1.3fr 1.1fr auto; gap: 10px; padding: 10px; border-top: 1px solid var(--line); align-items: center; }
      .coverage-row:first-child { border-top: 0; }
      .coverage-row.header { background: #f1f5f9; color: var(--muted); font-size: 12px; }
      .rule-list, .raw-details, .report-section { border-top: 1px solid var(--line); padding-top: 8px; }
      .rule-list summary, .raw-details summary, .report-section summary { cursor: pointer; min-height: 32px; font-weight: 800; }
      .stage-retry-actions { border-radius: 12px; padding: 12px 14px; background: #fffbeb; border: 1px solid #fde68a; margin-top: 8px; }
      .notice-inline { min-width: 0; overflow: hidden; border-radius: 12px; padding: 10px 12px; border: 1px solid; display: grid; gap: 6px; }
      .notice-inline > * { min-width: 0; }
      .notice-inline p { margin: 4px 0 0; }
      .notice-inline .button-row { margin-top: 8px; }
      .notice-inline-message { overflow-wrap: anywhere; }
      .notice-inline-diagnostics {
        border-top: 1px dashed currentColor;
        padding-top: 6px;
      }
      .notice-inline-diagnostics summary {
        cursor: pointer;
        min-height: 30px;
        font-weight: 800;
      }
      .notice-inline-raw {
        margin: 6px 0 0;
        max-height: 180px;
        overflow: auto;
        border: 1px solid rgba(15, 23, 42, .1);
        border-radius: 10px;
        padding: 9px 10px;
        background: rgba(255, 255, 255, .72);
        color: var(--text);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        word-break: break-word;
        font-size: 11px;
        line-height: 1.45;
      }
      .notice-inline.bad { background: var(--bad-bg); border-color: #fecaca; color: var(--bad); }
      .notice-inline.warn { background: var(--warn-bg); border-color: #fde68a; color: var(--warn); }
      .notice-inline.info { background: var(--info-bg); border-color: #bfdbfe; color: var(--info); }
      .notice-inline.good { background: var(--good-bg); border-color: #bbf7d0; color: var(--good); }
      .summary-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
      .summary-item { border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: #fbfdff; }
      .reports-page { padding: 24px 28px 36px; gap: 18px; }
      .reports-overview-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: stretch; }
      .reports-overview-card { display: grid; gap: 12px; align-content: start; min-width: 0; }
      .reports-list-panel { display: grid; gap: 14px; }
      .reports-tabs { display: flex; flex-wrap: wrap; gap: 4px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
      .report-list { display: grid; gap: 10px; }
      .report-card {
        display: grid !important; gap: 10px; align-items: stretch; min-width: 0;
        border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; background: #fbfdff;
      }
      .report-card.failed { border-color: #fecaca; background: #fef2f2; }
      .report-card.awaiting_human, .report-card.awaiting_clarification { border-color: #fde68a; background: #fffbeb; }
      .report-card.completed { border-color: #bbf7d0; background: #f8fffb; }
      .report-card.running, .report-card.claimed, .report-card.pending { border-color: #bfdbfe; background: #eff6ff; }
      .report-card-main { display: grid !important; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; }
      .report-title-copy { min-width: 0; display: grid; gap: 3px; }
      .report-title-copy strong { min-width: 0; overflow-wrap: anywhere; }
      .report-title-copy small { color: var(--muted); overflow-wrap: anywhere; }
      .report-card-summary { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 8px; }
      .report-actions { justify-content: flex-end; }
      .report-detail { display: grid; gap: 12px; }
      .report-detail-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
      .report-tech-details { border-top: 1px dashed var(--line); padding-top: 8px; }
      .report-tech-details summary { cursor: pointer; min-height: 30px; font-weight: 800; }
      .report-tech-details code { overflow-wrap: anywhere; word-break: break-all; }
      .empty-state.reports-empty-state { box-shadow: none; display: grid; gap: 8px; min-height: auto; margin: 0; align-content: start; }
      .knowledge-card.accepted, .knowledge-card.edited { background: #f0fdf4; border-color: #86efac; }
      .knowledge-card.ignored { opacity: .72; background: #f8fafc; }
      .knowledge-page { padding: 24px 28px 36px; gap: 18px; }
      .knowledge-overview-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: stretch; }
      .knowledge-overview-card { display: grid; gap: 12px; align-content: start; min-width: 0; }
      .knowledge-workspace-panel { display: grid; gap: 14px; }
      .knowledge-tabs { display: flex; flex-wrap: wrap; gap: 4px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
      .knowledge-list { display: grid; gap: 10px; }
      .knowledge-card, .knowledge-asset-card, .knowledge-usage-row {
        border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; background: #fbfdff;
        display: grid; gap: 10px; min-width: 0;
      }
      .knowledge-asset-card.accepted { border-color: #bbf7d0; background: #f8fffb; }
      .knowledge-asset-card.draft { border-color: #fde68a; background: #fffbeb; }
      .knowledge-asset-card.superseded { opacity: .76; background: #f8fafc; }
      .knowledge-title-copy { min-width: 0; display: grid; gap: 3px; }
      .knowledge-title-copy strong { min-width: 0; overflow-wrap: anywhere; }
      .knowledge-title-copy small { color: var(--muted); overflow-wrap: anywhere; }
      .knowledge-summary { margin: 0; line-height: 1.55; overflow-wrap: anywhere; }
      .knowledge-impact-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .knowledge-source-details { border-top: 1px dashed var(--line); padding-top: 8px; }
      .knowledge-source-details summary { cursor: pointer; min-height: 30px; font-weight: 800; }
      .knowledge-source-details code { overflow-wrap: anywhere; word-break: break-all; }
      .knowledge-edit-box { display: grid; gap: 8px; border: 1px solid var(--line); border-radius: 12px; background: #fff; padding: 10px; }
      .knowledge-edit-textarea {
        width: 100%; min-height: 120px; resize: vertical; border: 1px solid var(--line-strong); border-radius: 12px;
        padding: 10px 12px; color: var(--text); font: inherit; line-height: 1.55;
      }
      .knowledge-edit-textarea:focus { outline: 3px solid rgba(37, 99, 235, .28); outline-offset: 1px; border-color: var(--primary); }
      .empty-state.knowledge-empty-state { box-shadow: none; display: grid; gap: 8px; min-height: auto; margin: 0; align-content: start; }

        gap: 4px;
        padding: 10px 0 12px;
        background: rgba(248, 250, 252, .92);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--line);
        z-index: 4;
        margin: 0 -4px 12px;
      }
      .tab-button {
        border: 0;
        background: transparent;
        padding: 8px 14px;
        border-radius: 10px;
        color: var(--muted);
        font-weight: 700;
        font-size: 13px;
        min-height: 36px;
        cursor: pointer;
        transition: background .16s ease, color .16s ease;
      }
      .tab-button:hover { background: rgba(37, 99, 235, .06); color: var(--text); }
      .tab-button.active {
        background: var(--primary);
        color: #fff;
        box-shadow: var(--shadow);
      }
      .config-list { display: grid; gap: 10px; margin-top: 4px; }
      .config-row {
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px 16px;
        background: var(--surface);
        display: grid;
        gap: 8px;
        transition: border-color .16s ease, background .16s ease, box-shadow .16s ease;
      }
      .config-row:hover { border-color: var(--line-strong); }
      .config-row.overridden {
        border-color: var(--info);
        box-shadow: 0 0 0 1px rgba(29, 78, 216, .12) inset;
      }
      .config-row.dirty {
        border-color: var(--warn);
        background: var(--warn-bg);
      }
      .config-row-header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: start;
      }
      .config-title-copy { min-width: 0; display: grid; gap: 3px; }
      .config-title { font-size: 15px; color: var(--text); overflow-wrap: anywhere; }
      .config-row-badges { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
      .config-key {
        font-family: "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
        color: var(--text);
        font-weight: 800;
      }
      .config-meta {
        font-family: "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        color: var(--muted);
        background: #eef4ff;
        border-radius: 999px;
        padding: 2px 10px;
      }
      .config-description {
        margin: 0;
        font-size: 13px;
        color: var(--muted);
        line-height: 1.55;
        overflow-wrap: anywhere;
      }
      .config-source {
        margin: 0;
        font-family: "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        color: var(--muted);
      }
      .config-row textarea,
      .config-row input[type="text"],
      .config-row input[type="number"] {
        width: 100%;
        font-family: "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
        line-height: 1.55;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--line-strong);
        background: #fff;
        color: var(--text);
        resize: vertical;
        transition: border-color .12s ease, box-shadow .12s ease;
      }
      .config-row textarea:focus,
      .config-row input[type="text"]:focus,
      .config-row input[type="number"]:focus {
        outline: 3px solid rgba(37, 99, 235, .32);
        outline-offset: 1px;
        border-color: var(--primary);
      }
      .config-summary-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .config-edit-details, .config-technical-details {
        border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 2px;
      }
      .config-edit-details summary, .config-technical-details summary {
        cursor: pointer; min-height: 30px; font-weight: 800; color: var(--text);
      }
      .config-edit-details[open], .config-technical-details[open] { display: grid; gap: 10px; }
      .config-technical-details code { overflow-wrap: anywhere; word-break: break-all; }
      .config-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding-top: 8px;
        border-top: 1px dashed var(--line);
        margin-top: 4px;
      }
      .config-history {
        border-top: 1px dashed var(--line);
        margin-top: 4px;
        padding-top: 8px;
        display: grid;
        gap: 6px;
      }
      .config-history-row {
        display: grid;
        grid-template-columns: 130px 90px minmax(0, 1fr) minmax(0, 1fr);
        gap: 10px;
        font-size: 12px;
        align-items: baseline;
      }
      .config-history-time, .config-history-actor {
        color: var(--muted);
        font-family: "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .config-history-old, .config-history-new {
        font-family: "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        word-break: break-all;
        color: var(--text);
      }
      @media (max-width: 1180px) {
        .reports-overview-grid { grid-template-columns: 1fr; }
        .report-card-summary, .report-detail-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .knowledge-overview-grid { grid-template-columns: 1fr; }
        .knowledge-impact-grid { grid-template-columns: 1fr; }
        .settings-overview-grid, .settings-diagnostics-grid { grid-template-columns: 1fr; }
        .config-summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
      @media (max-width: 780px) {
        .reports-page { padding: 16px; }
        .report-card { padding: 12px; }
        .report-card-main, .report-card-summary, .report-detail-metrics { grid-template-columns: 1fr; }
        .report-actions { justify-content: flex-start; }
        .knowledge-page { padding: 16px; }
        .knowledge-card, .knowledge-asset-card, .knowledge-usage-row { padding: 12px; }
        .knowledge-head { align-items: flex-start; flex-direction: column; }
        .settings-page { padding: 16px; }
        .settings-summary-grid, .settings-kpi-row, .config-summary-grid, .config-row-header, .config-history-row { grid-template-columns: 1fr; }
        .config-tabs { top: 0; margin-left: 0; margin-right: 0; }
        .config-row-badges { justify-content: flex-start; }
        .config-actions .button { flex: 1 1 100%; }
      }
      .error-banner {
        border: 1px solid var(--bad);
        background: var(--bad-bg);
        color: var(--bad);
        border-radius: 12px;
        padding: 10px 12px;
        font-size: 13px;
      }

      /* Toast Notification */
      .toast-container {
        position: fixed;
        top: 24px;
        right: 24px;
        z-index: 100;
        display: grid;
        gap: 12px;
        max-width: 420px;
        pointer-events: none;
      }
      .toast {
        pointer-events: auto;
        background: white;
        border-radius: 16px;
        padding: 16px 18px;
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.18), 0 4px 12px rgba(15, 23, 42, 0.12);
        border: 1px solid var(--line);
        display: grid;
        gap: 10px;
        min-width: 320px;
        animation: toast-slide-in 0.32s cubic-bezier(0.16, 1, 0.3, 1);
        position: relative;
        overflow: hidden;
      }
      .toast.toast-success {
        border-color: #86efac;
        background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
      }
      .toast.toast-error {
        border-color: #fecaca;
        background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
      }
      .toast.toast-hiding {
        animation: toast-slide-out 0.28s cubic-bezier(0.5, 0, 0.75, 0);
        opacity: 0;
      }
      .toast-header {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .toast-icon {
        width: 28px;
        height: 28px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        flex-shrink: 0;
        font-size: 16px;
      }
      .toast-success .toast-icon {
        background: var(--good);
        color: white;
      }
      .toast-error .toast-icon {
        background: var(--bad);
        color: white;
      }
      .toast-content {
        flex: 1;
        min-width: 0;
      }
      .toast-title {
        margin: 0;
        font-size: 15px;
        font-weight: 800;
        color: var(--text);
      }
      .toast-message {
        margin: 3px 0 0;
        font-size: 13px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .toast-countdown {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }
      .toast-countdown-number {
        min-width: 16px;
        text-align: center;
        color: var(--text);
        font-weight: 900;
      }
      .toast-progress {
        position: absolute;
        bottom: 0;
        left: 0;
        height: 3px;
        background: var(--good);
        transition: width 0.1s linear;
        border-radius: 0 0 0 16px;
      }
      .toast-error .toast-progress {
        background: var(--bad);
      }
      .toast-close {
        width: 24px;
        height: 24px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.06);
        border: 0;
        display: grid;
        place-items: center;
        cursor: pointer;
        transition: background 0.16s ease;
        flex-shrink: 0;
        padding: 0;
        color: var(--muted);
        font-size: 14px;
        font-weight: 900;
      }
      .toast-close:hover {
        background: rgba(15, 23, 42, 0.12);
        color: var(--text);
      }
      @keyframes toast-slide-in {
        from {
          opacity: 0;
          transform: translateX(100px) scale(0.92);
        }
        to {
          opacity: 1;
          transform: translateX(0) scale(1);
        }
      }
      @keyframes toast-slide-out {
        from {
          opacity: 1;
          transform: translateX(0) scale(1);
        }
        to {
          opacity: 0;
          transform: translateX(100px) scale(0.92);
        }
      }
      @media (max-width: 780px) {
        .toast-container {
          top: 12px;
          right: 12px;
          left: 12px;
          max-width: none;
        }
        .toast {
          min-width: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="app" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
