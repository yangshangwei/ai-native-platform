<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Octopus · AI Delivery Workbench</title>
    <!-- Design System - AI delivery workbench -->
    <link rel="stylesheet" href="/design-tokens.css" />
    <link rel="stylesheet" href="/design-tokens-dark.css" />
    <link rel="stylesheet" href="/components.css" />
    <link rel="stylesheet" href="/utilities.css" />
    <link rel="stylesheet" href="/animations.css" />
    <style>
      :root {
        --bg: #f6f7f9;
        --surface: #ffffff;
        --surface-2: #f1f3f7;
        --surface-3: #e8ecf3;
        --line: #d8dee8;
        --line-strong: #aeb9c9;
        --text: #171c26;
        --text-primary: #171c26;
        --text-secondary: #47505f;
        --text-muted: #6b7280;
        --muted: #6b7280;
        --faint: #9aa3b2;
        --primary: #5e6ad2;
        --primary-2: #8b92e7;
        --orange: #d97706;
        --good: #157f4f;
        --good-bg: #e5f6ed;
        --bad: #b4232a;
        --bad-bg: #feecef;
        --warn: #a15c07;
        --warn-bg: #fff4db;
        --info: #2563a8;
        --info-bg: #e8f1ff;
        --stage-thinking: #b45309;
        --stage-thinking-bg: #fff4db;
        --stage-context: #2563a8;
        --stage-context-bg: #e8f1ff;
        --stage-implementation: #6d5bd0;
        --stage-implementation-bg: #f0edff;
        --stage-validation: #15803d;
        --stage-validation-bg: #e5f6ed;
        --stage-done: #157f4f;
        --stage-done-bg: #e5f6ed;
        --shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
        --radius: 8px;
        /* Design tokens for components.css */
        --bg-surface: #ffffff;
        --bg-surface-hover: #f1f3f7;
        --border-light: #dbe3ef;
      }

      /* Explicit light theme - overrides @media rules */
      [data-theme="light"] {
        --bg: #f6f7f9;
        --surface: #ffffff;
        --surface-2: #f1f3f7;
        --surface-3: #e8ecf3;
        --text-primary: #171c26;
        --text-secondary: #47505f;
        --text-muted: #6b7280;
        --bg-surface: #ffffff;
        --bg-surface-hover: #f1f3f7;
        --border-light: #d8dee8;
      }

      /* Dark Mode */
      [data-theme="dark"] {
        --bg: #080a0f;
        --surface: #101318;
        --surface-2: #181d25;
        --surface-3: #202734;
        --line: #252b36;
        --line-strong: #3a4250;
        --text: #f4f5f7;
        --text-primary: #f4f5f7;
        --text-secondary: #c2c7d0;
        --text-muted: #8c95a3;
        --muted: #8c95a3;
        --faint: #626b79;
        --primary: #8b92e7;
        --primary-2: #a5abf3;
        --orange: #f59e0b;
        --good: #7dd3a5;
        --good-bg: #0f2a21;
        --bad: #f38a8a;
        --bad-bg: #351618;
        --warn: #f2c66d;
        --warn-bg: #332614;
        --info: #93b7ff;
        --info-bg: #13233e;
        --stage-thinking: #f2c66d;
        --stage-thinking-bg: #332614;
        --stage-context: #93b7ff;
        --stage-context-bg: #13233e;
        --stage-implementation: #b7a7ff;
        --stage-implementation-bg: #241f3b;
        --stage-validation: #7dd3a5;
        --stage-validation-bg: #0f2a21;
        --stage-done: #7dd3a5;
        --stage-done-bg: #0f2a21;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.24);
        /* Override design-tokens.css for dark mode */
        --bg-surface: #101318;
        --bg-surface-hover: #181d25;
        --border-light: #252b36;
      }
      [data-theme="dark"] .skeleton-header,
      [data-theme="dark"] .skeleton-body,
      [data-theme="dark"] .skeleton-list-item,
      [data-theme="dark"] .skeleton-text {
        background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
      }

      * { box-sizing: border-box; }
      html { color-scheme: light; }
      html.no-transition,
      html.no-transition * { transition: none !important; }
      [data-theme="dark"] { color-scheme: dark; }
      body {
        margin: 0;
        min-width: 360px;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.55 "Fira Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      button, input, select, textarea { font: inherit; }
      button { cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: .55; }
      button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--primary) 34%, transparent);
        outline-offset: 2px;
      }
      code, pre, .command-chip { font-family: "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

      .app-shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 284px minmax(0, 1fr);
        transition: grid-template-columns 0.3s ease;
      }
      .app-shell.sidebar-collapsed {
        grid-template-columns: 64px minmax(0, 1fr);
      }
      .app-shell.sidebar-collapsed .sidebar {
        overflow: visible;
      }
      .app-shell.sidebar-collapsed .sidebar > *:not(.sidebar-collapsed-icons) {
        display: none;
      }
      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
        background: var(--surface);
        color: var(--text);
        border-right: 1px solid var(--line);
        transition: all 0.3s ease;
      }
      .sidebar-collapsed-icons {
        display: none;
        flex-direction: column;
        gap: 8px;
        padding: 18px 12px;
        align-items: center;
      }
      .app-shell.sidebar-collapsed .sidebar-collapsed-icons {
        display: flex;
      }
      .sidebar-collapsed-icon-btn {
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: var(--radius);
        background: transparent;
        color: var(--muted);
        display: grid;
        place-items: center;
        cursor: pointer;
        transition: all 0.18s ease;
        position: relative;
      }
      .sidebar-collapsed-icon-btn:hover {
        background: var(--surface-2);
        color: var(--text);
      }
      .sidebar-collapsed-icon-btn.active {
        background: var(--surface-2);
        color: var(--primary);
        box-shadow: inset 3px 0 0 var(--primary);
      }
      .sidebar-collapsed-icon-btn .icon {
        width: 20px;
        height: 20px;
      }
      .sidebar-collapsed-icon-btn .nav-badge {
        position: absolute;
        top: -4px;
        right: -4px;
        min-width: 18px;
        height: 18px;
        font-size: 10px;
        padding: 0 4px;
      }
      .sidebar-collapsed-divider {
        width: 32px;
        height: 1px;
        background: var(--line);
        margin: 4px auto;
      }
      .sidebar-collapsed-expand {
        margin-top: auto;
        padding-top: 12px;
        border-top: 1px solid var(--line);
      }
      .brand {
        display: flex; gap: 12px; align-items: center;
        padding: 22px 18px 18px;
        flex-shrink: 0;
      }
      .brand-mark {
        width: 42px; height: 42px; border-radius: var(--radius);
        display: grid; place-items: center;
        background: var(--surface-2); color: var(--primary); font-weight: 800;
        border: 1px solid var(--line);
      }
      .brand strong { display: block; font-size: 15px; color: var(--text); }
      .brand span { display: block; color: var(--muted); font-size: 12px; }
      .nav-list {
        display: grid; gap: 4px;
        padding: 0 18px;
        flex: 1;
        overflow-y: auto;
      }
      .nav-item {
        width: 100%; min-height: 48px; border: 1px solid transparent; border-radius: var(--radius);
        background: transparent; color: var(--muted); padding: 10px 12px;
        display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center;
        text-align: left; transition: all .18s ease;
        position: relative;
      }
      .nav-item:hover { background: var(--surface-2); color: var(--text); }
      .nav-item.active {
        background: var(--surface-2);
        border-color: var(--line);
        color: var(--text);
      }
      .nav-item.active::before {
        content: "";
        position: absolute;
        left: 0;
        top: 9px;
        bottom: 9px;
        width: 3px;
        border-radius: 999px;
        background: var(--primary);
      }
      .nav-item.active .icon { color: var(--primary); }
      .nav-item strong { display: block; font-size: 14px; }
      .nav-item small { display: block; color: var(--faint); font-size: 11px; }
      .nav-badge {
        min-width: 20px; height: 20px; border-radius: 999px;
        background: var(--bad); color: #fff;
        display: grid; place-items: center;
        font-size: 11px; font-weight: 900;
        padding: 0 6px;
      }
      .nav-divider {
        height: 1px; margin: 8px 0;
        background: var(--line);
      }
      .icon { width: 20px; height: 20px; }
      .sidebar-card {
        margin: 18px 18px 0; padding: 12px; border-radius: var(--radius);
        background: var(--surface); border: 1px solid var(--line);
        flex-shrink: 0;
      }
      .sidebar-card h2 { color: var(--muted); font-size: 12px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: .06em; }
      .queue-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .queue-console-grid { display: grid; gap: 6px; }
      .queue-console-stat {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: baseline;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface-2);
        padding: 9px 10px;
      }
      .queue-console-stat span {
        color: var(--muted);
        font-size: 11px;
        min-width: 0;
      }
      .queue-console-stat strong {
        color: var(--text);
        font: 700 15px/1.1 "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .queue-console-stat.info strong { color: var(--info); }
      .queue-console-stat.warn strong { color: var(--warn); }
      .queue-latest {
        border-top: 1px solid var(--line);
        margin-top: 10px;
        padding-top: 10px;
      }

      /* 侧边栏底部工具栏 */
      .sidebar-footer {
        display: grid;
        gap: 4px;
        padding: 12px 18px;
        border-top: 1px solid var(--line);
        background: var(--surface);
        flex-shrink: 0;
      }
      .sidebar-footer-btn {
        width: 100%; min-height: 44px; border: 0; border-radius: var(--radius);
        background: transparent; color: var(--muted); padding: 10px 12px;
        display: flex; align-items: center; gap: 10px;
        text-align: left; transition: all .18s ease;
        font-size: 14px; font-weight: 500;
        cursor: pointer;
      }
      .sidebar-footer-btn:hover {
        background: var(--surface-2);
        color: var(--text);
      }
      .sidebar-footer-btn .icon {
        width: 20px; height: 20px;
        flex-shrink: 0;
      }

      .main-shell { min-width: 0; }
      .topbar {
        position: sticky; top: 0; z-index: 10;
        background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--line);
        padding: 18px 28px;
        display: grid; grid-template-columns: minmax(220px, 1fr) auto; gap: 20px; align-items: center;
      }
      .eyebrow { color: var(--primary); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; font-size: 11px; }
      .topbar h1 { margin: 2px 0 0; font-size: clamp(22px, 2vw, 32px); line-height: 1.15; }
      .topbar-right { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
      .global-status-strip {
        display: grid;
        grid-template-columns: repeat(3, minmax(88px, max-content));
        gap: 2px;
        align-items: stretch;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: color-mix(in srgb, var(--surface) 88%, var(--bg));
      }
      .global-status-item {
        min-width: 88px;
        display: grid;
        grid-template-columns: 8px minmax(0, 1fr);
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-radius: var(--radius-sm);
      }
      .global-status-item.bad { background: color-mix(in srgb, var(--bad-bg) 70%, transparent); }
      .global-status-item.info { background: color-mix(in srgb, var(--info-bg) 70%, transparent); }
      .global-status-item.good { background: color-mix(in srgb, var(--good-bg) 70%, transparent); }
      .global-status-item.warn { background: color-mix(in srgb, var(--warn-bg) 70%, transparent); }
      .global-status-indicator {
        width: 8px;
        height: 28px;
        border-radius: var(--radius-full);
        background: var(--muted);
      }
      .global-status-item.bad .global-status-indicator { background: var(--bad); }
      .global-status-item.info .global-status-indicator { background: var(--info); }
      .global-status-item.good .global-status-indicator { background: var(--good); }
      .global-status-item.warn .global-status-indicator { background: var(--warn); }
      .global-status-copy { min-width: 0; display: grid; gap: 1px; }
      .global-status-label {
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        line-height: 1.1;
        white-space: nowrap;
      }
      .global-status-value {
        min-width: 0;
        color: var(--text);
        font-size: 15px;
        font-weight: 900;
        line-height: 1.15;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .global-status-item.bad .global-status-value { color: var(--bad); }
      .global-status-item.info .global-status-value { color: var(--info); }
      .global-status-item.good .global-status-value { color: var(--good); }
      .global-status-item.warn .global-status-value { color: var(--warn); }
      .topbar h1 { margin: 2px 0 0; font-size: clamp(22px, 2vw, 32px); line-height: 1.15; }
      .context-strip {
        display: grid;
        grid-template-columns: minmax(240px, 1.4fr) minmax(220px, 1fr) minmax(190px, .85fr);
        justify-content: flex-end;
        gap: 8px;
        width: min(760px, 100%);
      }

      /* Welcome Guide */
      .welcome-guide {
        grid-column: 1 / -1;
        background: var(--info-bg);
        border: 2px solid var(--primary-2);
      }
      .welcome-checklist { display: grid; gap: 12px; margin-top: 12px; }
      .checklist-item {
        display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: start;
        padding: 12px; border-radius: 12px; background: var(--surface);
        border: 1px solid var(--line);
      }
      .checklist-item.completed {
        background: var(--good-bg); border-color: #86efac;
      }
      .checklist-icon {
        font-size: 24px; line-height: 1;
      }
      .checklist-content { display: grid; gap: 4px; }
      .checklist-content strong { font-size: 14px; }
      .checklist-detail {
        margin: 0; color: var(--muted); font-size: 13px;
        display: flex; align-items: center; gap: 8px;
      }

      .context-item {
        min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius);
        background: var(--surface); box-shadow: var(--shadow); display: grid; gap: 2px; align-content: center;
      }
      .context-item.primary { border-color: color-mix(in srgb, var(--info) 28%, var(--line)); background: var(--info-bg); }
      .context-item.primary strong { font-size: 15px; }
      .context-item.focus { border-color: color-mix(in srgb, var(--primary) 34%, var(--line)); }
      .context-item.supporting { background: var(--surface-2); box-shadow: none; }
      .context-item span { display: block; color: var(--muted); font-size: 11px; }
      .context-item strong { display: block; min-width: 0; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
      .context-item small { display: block; min-width: 0; color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); } .info { color: var(--info); } .muted { color: var(--muted); }

      .workbench-grid { padding: 24px 28px 36px; display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 20px; align-items: start; }
      .task-detail-grid { padding: 24px 28px 36px; display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 20px; align-items: start; }
      .workspace-main, .workspace-side, .page-stack { min-width: 0; display: grid; gap: 18px; }
      .mobile-next-action { display: none; }
      .desktop-next-action { display: block; }
      .page-grid { padding: 24px 28px 36px; display: grid; gap: 20px; }
      .page-grid.two-col { grid-template-columns: minmax(0, 1fr) minmax(320px, 440px); align-items: start; }

      .panel, .hero-card, .form-card, .empty-state {
        background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
        box-shadow: var(--shadow); padding: 18px; min-width: 0;
      }
      .hero-card { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(320px, .8fr); gap: 18px; align-items: center; }
      .hero-copy h2 { margin: 8px 0 8px; font-size: clamp(24px, 3vw, 40px); line-height: 1.1; letter-spacing: 0; }
      .hero-copy p { margin: 0; color: var(--muted); word-break: break-word; }
      .run-meta-line { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); }
      .panel-header { margin-bottom: 14px; }
      .panel-header h2 { margin: 0; font-size: 15px; letter-spacing: 0; }
      .panel-header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
      .side-panel { padding: 16px; }

      .task-hero { grid-template-columns: 1fr; align-items: start; max-width: 100%; }
      .task-hero > * { min-width: 0; }
      .task-hero .hero-copy h2 { font-size: clamp(24px, 2.4vw, 34px); overflow-wrap: anywhere; }
      .task-technical-summary { margin-top: 12px; }
      .task-technical-summary[open] { display: grid; gap: 4px; }
      .task-technical-summary summary,
      .diagnostic-shell > summary,
      .stream-log-details > summary {
        cursor: pointer; min-height: 34px; font-weight: 800;
        display: flex; align-items: center; justify-content: space-between; gap: 8px;
      }
      .diagnostic-panel { background: var(--surface-2); }
      .diagnostic-shell { border-top: 0; padding-top: 0; }
      .diagnostic-shell[open] { display: grid; gap: 10px; }
      .diagnostic-metrics { margin: 10px 0; }

      .metric-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .overview-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
      .config-grid { display: grid; grid-template-columns: repeat(5, minmax(160px, 1fr)); gap: 10px; }
      .overview-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; background: var(--surface); min-height: 128px; min-width: 0; }
      .overview-card-head, .mini-row, .knowledge-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .mini-row { min-width: 0; max-width: 100%; overflow: hidden; border-top: 1px dashed var(--line); padding-top: 7px; font-size: 12px; }
      .mini-row span { flex: 1 1 auto; min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .mini-row .button, .mini-row code { flex: 0 0 auto; }
      .workbench-action-panel { display: grid; gap: 12px; }
      .workbench-primary-action {
        display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center;
        border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 14px;
      }
      .workbench-primary-copy { min-width: 0; display: grid; gap: 5px; }
      .workbench-primary-copy strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .workbench-primary-copy small { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .workbench-secondary-actions { display: grid; gap: 8px; }
      .empty-action-panel { border-color: var(--line); background: var(--surface); }
      .action-queue-panel { display: grid; gap: 14px; }
      .action-queue-head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 14px;
        align-items: center;
      }
      .action-queue-head h2 {
        margin: 2px 0 2px;
        font-size: 18px;
        line-height: 1.2;
      }
      .action-queue-list { display: grid; gap: 8px; }
      .action-queue-item {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        min-width: 0;
        border: 1px solid var(--line);
        border-left: 3px solid var(--line-strong);
        border-radius: var(--radius);
        background: var(--surface);
        padding: 10px 12px;
      }
      .action-queue-item.warn { border-left-color: var(--warn); }
      .action-queue-item.bad { border-left-color: var(--bad); }
      .action-queue-item.info { border-left-color: var(--info); }
      .action-queue-item.good { border-left-color: var(--good); }
      .action-queue-copy { min-width: 0; display: grid; gap: 3px; }
      .action-queue-copy strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .action-queue-copy small { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .workbench-stat-card .stack { gap: 8px; }
      .workbench-task-section { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
      .workbench-task-section:first-of-type { border-top: 0; padding-top: 0; }
      .workbench-section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .workbench-section-head h3 { margin: 0; font-size: 14px; }
      .workbench-all-tasks { margin-top: 12px; }
      .workbench-environment-panel { background: var(--surface-2); }
      .workbench-environment-details summary { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

      .config-row:hover { border-color: var(--line-strong); }
      .config-row.overridden {
        border-left-color: var(--info);
      }
      .config-row.dirty {
        border-left-color: var(--warn);
        background: var(--warn-bg);
      }
      .config-row.recently-saved {
        border-left-color: var(--good);
        background: var(--good-bg);
      }
      .config-row-header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: start;
      }
      .config-title-copy { min-width: 0; display: grid; gap: 3px; }
      .config-title { font-size: 15px; color: var(--text); overflow-wrap: anywhere; }
      .config-row-badges { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
      .config-row-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .config-value-preview {
        display: flex;
        align-items: baseline;
        gap: 6px;
        flex: 1 1 auto;
        min-width: 0;
      }
      .config-value-label {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        flex-shrink: 0;
      }
      .config-value-text {
        font-family: "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1 1 auto;
        min-width: 0;
      }
      .config-quick-actions {
        display: flex;
        gap: 6px;
        flex-shrink: 0;
      }
      .config-key {
        font-family: "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
        color: var(--text);
        font-weight: 800;
      }
      .config-meta {
        font-family: "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        color: var(--muted);
        background: var(--surface-2);
        border-radius: 999px;
        padding: 2px 10px;
      }
      .config-description {
        margin: 0;
        font-size: 13px;
        color: var(--muted);
        line-height: 1.55;
        overflow-wrap: anywhere;
      }
      .config-source {
        margin: 0;
        font-family: "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        color: var(--muted);
      }
      .config-row textarea,
      .config-row input[type="text"],
      .config-row input[type="number"] {
        width: 100%;
        font-family: "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
        line-height: 1.55;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--line-strong);
        background: var(--surface);
        color: var(--text);
        resize: vertical;
        transition: border-color .12s ease, box-shadow .12s ease;
      }
      .config-row textarea:focus,
      .config-row input[type="text"]:focus,
      .config-row input[type="number"]:focus {
        outline: 3px solid rgba(37, 99, 235, .32);
        outline-offset: 1px;
        border-color: var(--primary);
      }
      .config-row select,
      .config-row .config-input {
        width: 100%;
        font-family: "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
        line-height: 1.55;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--line-strong);
        background: var(--surface);
        color: var(--text);
        transition: border-color .12s ease, box-shadow .12s ease;
      }
      .config-row select:focus,
      .config-row .config-input:focus {
        outline: 3px solid rgba(37, 99, 235, .32);
        outline-offset: 1px;
        border-color: var(--primary);
      }
      .config-summary-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .config-edit-details, .config-technical-details {
        border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 2px;
      }
      .config-edit-details summary, .config-technical-details summary {
        cursor: pointer; min-height: 30px; font-weight: 800; color: var(--text);
      }
      .config-edit-details[open], .config-technical-details[open] { display: grid; gap: 10px; }
      .config-technical-details code { overflow-wrap: anywhere; word-break: break-all; }
      .config-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding-top: 8px;
        border-top: 1px dashed var(--line);
        margin-top: 4px;
      }
      .config-history {
        border-top: 1px dashed var(--line);
        margin-top: 4px;
        padding-top: 8px;
        display: grid;
        gap: 6px;
      }
      .config-history-row {
        display: grid;
        grid-template-columns: 130px 90px minmax(0, 1fr) minmax(0, 1fr);
        gap: 10px;
        font-size: 12px;
        align-items: baseline;
      }
      .config-history-time, .config-history-actor {
        color: var(--muted);
        font-family: "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .config-history-old, .config-history-new {
        font-family: "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        word-break: break-all;
        color: var(--text);
      }
      @media (max-width: 1180px) {
        .reports-overview-grid { grid-template-columns: 1fr; }
        .report-card-summary, .report-detail-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .knowledge-overview-grid { grid-template-columns: 1fr; }
        .knowledge-impact-grid { grid-template-columns: 1fr; }
        .settings-overview-grid, .settings-diagnostics-grid { grid-template-columns: 1fr; }
        .config-summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
      @media (max-width: 780px) {
        .reports-page { padding: 16px; }
        .report-card { padding: 12px; }
        .report-card-main, .report-card-summary, .report-detail-metrics { grid-template-columns: 1fr; }
        .report-actions { justify-content: flex-start; }
        .knowledge-page { padding: 16px; }
        .knowledge-card, .knowledge-asset-card, .knowledge-usage-row { padding: 12px; }
        .knowledge-head { align-items: flex-start; flex-direction: column; }
        .settings-page { padding: 16px; }
        .settings-summary-grid, .settings-kpi-row, .config-summary-grid, .config-row-header, .config-history-row { grid-template-columns: 1fr; }
        .config-tabs { top: 0; margin-left: 0; margin-right: 0; }
        .config-row-badges { justify-content: flex-start; }
        .config-actions .button { flex: 1 1 100%; }
      }
      .error-banner {
        border: 1px solid var(--bad);
        background: var(--bad-bg);
        color: var(--bad);
        border-radius: 12px;
        padding: 10px 12px;
        font-size: 13px;
      }

      /* Toast Notification */
      .toast-container {
        position: fixed;
        top: 24px;
        right: 24px;
        z-index: 100;
        display: grid;
        gap: 12px;
        max-width: 420px;
        pointer-events: none;
      }
      .toast {
        pointer-events: auto;
        background: var(--surface);
        border-radius: 16px;
        padding: 16px 18px;
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.18), 0 4px 12px rgba(15, 23, 42, 0.12);
        border: 1px solid var(--line);
        display: grid;
        gap: 10px;
        min-width: 320px;
        animation: toast-slide-in 0.32s cubic-bezier(0.16, 1, 0.3, 1);
        position: relative;
        overflow: hidden;
      }
      .toast.toast-success {
        border-color: #86efac;
        background: var(--good-bg);
      }
      .toast.toast-error {
        border-color: #fecaca;
        background: var(--bad-bg);
      }
      .toast.toast-hiding {
        animation: toast-slide-out 0.28s cubic-bezier(0.5, 0, 0.75, 0);
        opacity: 0;
      }
      .toast-header {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .toast-icon {
        width: 28px;
        height: 28px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        flex-shrink: 0;
        font-size: 16px;
      }
      .toast-success .toast-icon {
        background: var(--good);
        color: white;
      }
      .toast-error .toast-icon {
        background: var(--bad);
        color: white;
      }
      .toast-content {
        flex: 1;
        min-width: 0;
      }
      .toast-title {
        margin: 0;
        font-size: 15px;
        font-weight: 800;
        color: var(--text);
      }
      .toast-message {
        margin: 3px 0 0;
        font-size: 13px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .toast-countdown {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }
      .toast-countdown-number {
        min-width: 16px;
        text-align: center;
        color: var(--text);
        font-weight: 900;
        font-size: 14px;
        background: var(--surface-2);
        padding: 2px 6px;
        border-radius: 4px;
      }
      .toast-progress {
        position: absolute;
        bottom: 0;
        left: 0;
        height: 3px;
        background: var(--good);
        transition: width 0.1s linear;
        border-radius: 0 0 0 16px;
      }
      .toast-error .toast-progress {
        background: var(--bad);
      }
      .toast-close {
        width: 24px;
        height: 24px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.06);
        border: 0;
        display: grid;
        place-items: center;
        cursor: pointer;
        transition: background 0.16s ease;
        flex-shrink: 0;
        padding: 0;
        color: var(--muted);
        font-size: 14px;
        font-weight: 900;
      }
      .toast-close:hover {
        background: rgba(15, 23, 42, 0.12);
        color: var(--text);
      }
      @keyframes toast-slide-in {
        from {
          opacity: 0;
          transform: translateX(100px) scale(0.92);
        }
        to {
          opacity: 1;
          transform: translateX(0) scale(1);
        }
      }
      @keyframes toast-slide-out {
        from {
          opacity: 1;
          transform: translateX(0) scale(1);
        }
        to {
          opacity: 0;
          transform: translateX(100px) scale(0.92);
        }
      }
      @media (max-width: 780px) {
        .toast-container {
          top: 12px;
          right: 12px;
          left: 12px;
          max-width: none;
        }
        .toast {
          min-width: 0;
        }
      }

      /* Skeleton Loading States */
      .skeleton-card {
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px 16px;
        background: var(--surface);
        display: grid;
        gap: 10px;
      }
      .skeleton-header {
        height: 24px;
        width: 60%;
        background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
        background-size: 200% 100%;
        animation: skeleton 1.5s ease-in-out infinite;
        border-radius: 4px;
      }
      .skeleton-body {
        height: 16px;
        width: 100%;
        background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
        background-size: 200% 100%;
        animation: skeleton 1.5s ease-in-out infinite;
        border-radius: 4px;
      }
      .skeleton-body.short {
        width: 40%;
      }
      .skeleton-list {
        display: grid;
        gap: 10px;
      }
      .skeleton-list-item {
        height: 80px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
        background-size: 200% 100%;
        animation: skeleton 1.5s ease-in-out infinite;
      }
      .skeleton-text {
        height: 16px;
        background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
        background-size: 200% 100%;
        animation: skeleton 1.5s ease-in-out infinite;
        border-radius: 4px;
      }
      .skeleton-text.short { width: 40%; }
      .skeleton-text.medium { width: 70%; }
      .skeleton-text.long { width: 100%; }
      [data-theme="dark"] .skeleton-header,
      [data-theme="dark"] .skeleton-body,
      [data-theme="dark"] .skeleton-list-item,
      [data-theme="dark"] .skeleton-text {
        background: linear-gradient(90deg, #2a2a2a 25%, #3a3a3a 50%, #2a2a2a 75%);
        background-size: 200% 100%;
      }
      @keyframes skeleton {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
    </style>
  </head>
  <body>
    <div id="app" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
